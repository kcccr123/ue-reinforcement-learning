run_name: ue5_vertical_slice
total_steps: 50000
data_dir: runs

worker:
  host: 127.0.0.1
  port: 7777

learner:
  type: sb3
  params:
    algorithm: PPO
    device: cpu
    learning_rate: 0.0003
    n_steps: 2048
    batch_size: 128
    n_epochs: 10
    gamma: 0.99
    gae_lambda: 0.95
    verbose: 1

checkpoint:
  save_freq: 10000
